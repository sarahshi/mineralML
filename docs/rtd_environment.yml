name: mineralML-RTD
channels:
    - conda-forge
    - pytorch
    - defaults
dependencies:
    # Pin compatible versions
    - python=3.9 # PyTorch on conda-forge has good 3.9 support
    - pip
    - pandoc
    
    # Core scientific stack via conda
    - numpy
    - scipy
    - pandas
    - matplotlib
    - scikit-learn
    - seaborn
    - openpyxl
    - ipython
    - ipykernel
    
    # PyTorch from conda-forge (more RTD compatible)
    - pytorch
    - cpuonly # Lightweight CPU-only version for docs
    
    # Remaining via pip
    - pip:
        - sphinx_rtd_theme>=0.5.0
        - sphinxcontrib-bibtex>=2.3.0
        - sphinx<=8.1.0
        - nbsphinx==0.9.6
        - python-ternary
        - -e ..